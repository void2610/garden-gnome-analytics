# data/<event>/event.yaml
# 同一イベント (event_slug = gemudan12-demo-2026-05) 全機器に紐付くメモ。
description: |
  ターンエンドボタンのタイミングにより進行不能になるバグがあった。20回くらい強制終了した気がする

# 開催時間帯 (JST, 半開区間 [start, end))。
# この時間外に開始されたランは開発者テストとみなして ingest 時に除外される。
play_hours:
  start: "11:00"
  end: "17:00"

# 最短プレイ時間 (秒)。これ未満の duration_sec のランは ingest 時に除外する。
# 客がすぐ離れたケースや動作確認リセットを分析対象から外すため。
min_duration_sec: 10
